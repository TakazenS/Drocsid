<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta og:title="%VITE_APP_TITLE%" />
    <meta og:description="%VITE_APP_DESCRIPTION%"/>
    <!-- <meta og:image="%VITE_APP_IMAGE%"/> -->
    <!-- <meta og:url="%VITE_APP_URL%"/> -->
     <meta og:type="%VITE_APP_TYPE%"/>

    <script>
      try {
        const theme = localStorage.getItem('drocsid-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
