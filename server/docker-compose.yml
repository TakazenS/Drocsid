services:
  storage:
    image: chrislusf/seaweedfs
    container_name: drocsid-storage
    restart: unless-stopped
    # If the container exits right after starting, uncomment the next line.
    # command: mini -dir=/data
    ports:
      # Bound to localhost only: these are development credentials.
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:8888:8888"   # Filer UI
      - "127.0.0.1:23646:23646" # Admin UI
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - storage-data:/data

volumes:
  storage-data:
    name: drocsid-storage-data
